<div class="gallery" data-columns="3" data-gap="md" data-aspect="square" data-captions="false" style="--gallery-color: #ffffff; --gallery-accent: #000000;">

      <figcaption class="gallery__caption">Mountain Sunrise</figcaption>
    </figure>
    <figure class="gallery__item">
      <div class="gallery__image" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);"></div>
      <figcaption class="gallery__caption">Rose Garden</figcaption>
    </figure>
    <figure class="gallery__item">
      <div class="gallery__image" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);"></div>
      <figcaption class="gallery__caption">Ocean View</figcaption>
    </figure>
    <figure class="gallery__item">
      <div class="gallery__image" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);"></div>
      <figcaption class="gallery__caption">Forest Trail</figcaption>
    </figure>
    <figure class="gallery__item">
      <div class="gallery__image" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);"></div>
      <figcaption class="gallery__caption">Sunset Beach</figcaption>
    </figure>
    <figure class="gallery__item">
      <div class="gallery__image" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);"></div>

      <div class="gallery__image" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);"></div>

    </figure>
    <figure class="gallery__item">
      <div class="gallery__image" style="background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);"></div>
      <figcaption class="gallery__caption">Arctic Ice</figcaption>
    </figure>
    <figure class="gallery__item">
      <div class="gallery__image" style="background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%);"></div>
      <figcaption class="gallery__caption">Morning Light</figcaption>
    </figure>
  </div>
</div>
