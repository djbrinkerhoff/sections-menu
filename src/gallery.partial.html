<div class="gallery" data-layout="grid" data-image-set="unsplash" data-images="12" data-columns="3" data-gap="md" data-aspect="square" data-fit="cover" data-captions="false" data-lightbox="false" data-heading="" data-subheading="" data-heading-align="left" data-autoplay="false" data-timing="4" data-pagination="dots" data-radius="8" data-bg-width="full" data-content-width="full" style="--gallery-color: #ffffff; --gallery-accent: #000000; --image-radius: 8px; --image-button-radius: 8px;">
  <div class="gallery__bg"></div>
  <div class="gallery__body">
    <h2 class="gallery__heading">Gallery</h2>
    <p class="gallery__subheading"></p>
    <div class="gallery__viewport">
      <div class="gallery__grid">
        <!-- Items built dynamically by gallery.controls.ts from IMAGE_SETS -->
      </div>

      <button class="gallery__prev" aria-label="Previous slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      </button>
      <button class="gallery__next" aria-label="Next slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9,6 15,12 9,18"/>
        </svg>
      </button>
    </div>

    <div class="gallery__pagination" role="tablist" aria-label="Choose slide"></div>
    <div class="gallery__counter" aria-live="polite">1 of 12</div>
  </div>
</div>
