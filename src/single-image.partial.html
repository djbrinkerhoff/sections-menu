<section class="single-image" data-mask="none" data-aspect="auto" data-caption="false" data-bg-width="full" data-content-width="medium" data-heading="" data-subheading="" style="--image-radius: 0px;">
  <div class="single-image__bg sw-bg"></div>
  <div class="single-image__body sw-body">
    <article class="single-image__story">
      <h2 class="single-image__heading"></h2>
      <p class="single-image__subheading"></p>
    </article>

    <figure class="single-image__figure">
      <button
        class="single-image__trigger image-lightbox__trigger"
        type="button"
        data-zoom-target="true"
      >
        <img
          class="single-image__image"
          src="/images/maximilian-bungart-QzlQHPG7cUY-unsplash.jpg"
          alt="Film portrait by Maximilian Bungart"
          width="1200"
          height="1790"
          loading="lazy"
        />
      </button>
      <figcaption class="single-image__caption">Scroll after opening to close, like Medium.</figcaption>
    </figure>
  </div>
</section>
