<section class="single-image" data-mask="none" data-caption="false" data-bg-width="full" data-content-width="medium" style="--image-radius: 0px;">
  <div class="single-image__bg sw-bg"></div>
  <div class="single-image__body sw-body">
    <article class="single-image__story">
      <p class="single-image__eyebrow">Standalone Image</p>
      <h2 class="single-image__title">Medium-style zoom, without a gallery.</h2>
      <p class="single-image__lede">
        Open the photograph, then scroll to close it. The same lightbox engine also powers the gallery section.
      </p>

      <figure class="single-image__figure">
        <button
          class="single-image__trigger image-lightbox__trigger"
          type="button"
          data-zoom-target="true"
        >
          <img
            class="single-image__image"
            src="/images/maximilian-bungart-QzlQHPG7cUY-unsplash.jpg"
            alt="Film portrait by Maximilian Bungart"
            width="1200"
            height="1790"
            loading="lazy"
          />
        </button>
        <figcaption class="single-image__caption">Scroll after opening to close, like Medium.</figcaption>
      </figure>
    </article>
  </div>
</section>
