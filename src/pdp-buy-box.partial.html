<section class="pdp-buy-box" data-pdp-layout="column" data-product-id="summit-tee" data-stock-style="off" data-price-display="lowest" data-currency-notation="sign" data-price-format="decimal" data-show-bnpl="true" data-aspect="square" data-fit="cover" data-radius="8" data-lightbox="true" style="--image-radius: 8px; --image-button-radius: 9999px;">
  <div class="pdp-buy-box__layout">
    <figure class="pdp-buy-box__media" data-layout="slideshow" data-pagination="thumbnails" data-gap="md">
      <div class="gallery__viewport">
        <div class="gallery__grid" data-pdp-slot="media-grid"></div>

        <button class="gallery__prev" type="button" aria-label="Previous slide">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15,18 9,12 15,6"/>
          </svg>
        </button>
        <button class="gallery__next" type="button" aria-label="Next slide">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9,6 15,12 9,18"/>
          </svg>
        </button>
      </div>

      <div class="gallery__pagination" role="tablist" aria-label="Choose product image"></div>
    </figure>

    <div class="pdp-buy-box__details">
      <div class="pdp-buy-box__buy">
        <header class="pdp-buy-box__header">
          <h2 class="pdp-buy-box__title" data-pdp-slot="title"></h2>
          <div class="pdp-buy-box__price-row">
            <p class="pdp-buy-box__price" data-pdp-slot="price"></p>
            <p class="pdp-buy-box__stock" data-pdp-slot="stock-header"></p>
          </div>
        </header>

        <section class="pdp-buy-box__bnpl" aria-label="Buy now, pay later options">
          <div class="pdp-buy-box__bnpl-logos" aria-hidden="true">
            <span class="pdp-buy-box__bnpl-badge pdp-buy-box__bnpl-badge--afterpay">Afterpay</span>
            <span class="pdp-buy-box__bnpl-badge pdp-buy-box__bnpl-badge--affirm">Affirm</span>
            <span class="pdp-buy-box__bnpl-badge pdp-buy-box__bnpl-badge--klarna">Klarna</span>
          </div>
          <p class="pdp-buy-box__bnpl-note" data-pdp-slot="bnpl-message"></p>
        </section>

        <div class="pdp-buy-box__option-group">
          <label class="pdp-buy-box__option-label" for="pdp-buy-box-select" data-pdp-slot="select-label"></label>
          <div class="pdp-buy-box__select-wrap">
            <select id="pdp-buy-box-select" class="pdp-buy-box__select" name="variant-select"></select>
          </div>
        </div>

        <fieldset class="pdp-buy-box__option-group">
          <legend class="pdp-buy-box__option-label" data-pdp-slot="chip-label"></legend>
          <div class="pdp-buy-box__chip-row" data-pdp-slot="chip-row"></div>
        </fieldset>

        <p class="pdp-buy-box__stock pdp-buy-box__stock--variant" data-pdp-slot="stock-variant" hidden></p>

        <div class="pdp-buy-box__purchase-row">
          <div class="pdp-buy-box__quantity" aria-label="Quantity selector">
            <button class="pdp-buy-box__quantity-btn" type="button" aria-label="Decrease quantity" data-quantity-action="decrement">−</button>
            <input class="pdp-buy-box__quantity-value" data-pdp-slot="quantity-value" type="text" inputmode="numeric" value="1" aria-label="Quantity" autocomplete="off" />
            <button class="pdp-buy-box__quantity-btn" type="button" aria-label="Increase quantity" data-quantity-action="increment">+</button>
          </div>
          <button class="pdp-buy-box__cta" type="button" data-pdp-slot="cta-label"></button>
        </div>

        <p class="pdp-buy-box__shipping-note" data-pdp-slot="shipping-note"></p>
      </div>

      <div class="pdp-buy-box__info-group">
        <details class="pdp-buy-box__info">
          <summary class="pdp-buy-box__info-summary">
            <h3 class="pdp-buy-box__info-title" data-pdp-slot="description-title"></h3>
          </summary>
          <p class="pdp-buy-box__info-body" data-pdp-slot="description-body"></p>
          <ul class="pdp-buy-box__info-list" data-pdp-slot="description-bullets"></ul>
        </details>

        <details class="pdp-buy-box__info">
          <summary class="pdp-buy-box__info-summary">
            <h3 class="pdp-buy-box__info-title" data-pdp-slot="shipping-title"></h3>
          </summary>
          <p class="pdp-buy-box__info-lead" data-pdp-slot="shipping-lead"></p>
          <p class="pdp-buy-box__info-body" data-pdp-slot="shipping-body"></p>
          <p class="pdp-buy-box__info-lead" data-pdp-slot="returns-lead"></p>
          <p class="pdp-buy-box__info-body" data-pdp-slot="returns-body"></p>
        </details>
      </div>
    </div>
  </div>
</section>
