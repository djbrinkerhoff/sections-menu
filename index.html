<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <title>Nav Prototype Shell</title>
</head>
<body class="min-h-screen bg-neutral-100 text-neutral-900">
  <div id="app" class="flex h-screen">
    <!-- Preview canvas (left) -->
    <div class="flex flex-1 flex-col overflow-hidden">
      <!-- Viewport switcher -->
      <div id="viewport-bar" class="viewport-bar">
        <span class="viewport-bar__label">Viewport</span>
        <div class="viewport-bar__controls">
          <button data-viewport="375" class="viewport-btn">375</button>
          <button data-viewport="768" class="viewport-btn">768</button>
          <button data-viewport="1280" class="viewport-btn">1280</button>
          <button data-viewport="fluid" class="viewport-btn">Fluid</button>
        </div>
      </div>
      <!-- Preview container -->
      <div class="flex flex-1 items-start justify-center overflow-auto bg-neutral-200 p-6">
        <div id="preview-root" class="w-[375px] min-h-[667px] bg-white shadow-xl rounded-lg overflow-hidden relative">
          <!-- nav.partial.html injected here by main.ts -->
        </div>
      </div>
    </div>
    <!-- Controls panel (right) -->
    <div id="controls-root" class="w-80 shrink-0 overflow-y-auto border-l border-zinc-800 bg-zinc-900">
      <!-- shell.ts renders the picker here, then controls go in #controls-container -->
      <div id="controls-container"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
