<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nav Prototype Shell</title>
</head>
<body class="min-h-screen bg-neutral-100 text-neutral-900">
  <div id="app" class="flex h-screen">
    <!-- Preview canvas (left) -->
    <div class="flex flex-1 flex-col overflow-hidden">
      <!-- Viewport switcher -->
      <div id="viewport-bar" class="flex items-center gap-2 border-b border-neutral-200 bg-white px-4 py-2">
        <span class="text-xs font-medium text-neutral-500 uppercase tracking-wide">Viewport</span>
        <div class="flex gap-1">
          <button data-viewport="375" class="viewport-btn rounded-md border border-neutral-300 px-3 py-1 text-xs font-medium hover:bg-neutral-50">375</button>
          <button data-viewport="768" class="viewport-btn rounded-md border border-neutral-300 px-3 py-1 text-xs font-medium hover:bg-neutral-50">768</button>
          <button data-viewport="1280" class="viewport-btn rounded-md border border-neutral-300 px-3 py-1 text-xs font-medium hover:bg-neutral-50">1280</button>
          <button data-viewport="fluid" class="viewport-btn rounded-md border border-neutral-300 px-3 py-1 text-xs font-medium hover:bg-neutral-50">Fluid</button>
        </div>
      </div>
      <!-- Preview container -->
      <div class="flex flex-1 items-start justify-center overflow-auto bg-neutral-200 p-6">
        <div id="preview-root" class="w-[375px] min-h-[667px] bg-white shadow-xl rounded-lg overflow-hidden relative">
          <!-- nav.partial.html injected here by main.ts -->
        </div>
      </div>
    </div>
    <!-- Controls panel (right) -->
    <div id="controls-root" class="w-80 shrink-0 overflow-y-auto border-l border-neutral-200 bg-white">
      <!-- controls.ts renders here -->
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
